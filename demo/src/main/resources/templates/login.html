<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | DigitalVX</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f7fb;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #fff;
            border: 1px solid #e8ebf2;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(21, 27, 43, .08);
        }

        .login-brand {
            margin-bottom: 28px;
            font-size: 30px;
            font-weight: 800;
            color: #151b2b;
        }

        .login-brand span {
            color: #6757d9;
        }

        .login-card h1 {
            margin-bottom: 8px;
            font-size: 25px;
        }

        .login-subtitle {
            margin-bottom: 26px;
            color: #778195;
            font-size: 14px;
        }

        .login-card .form-group {
            margin-bottom: 18px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1eb;
            border-radius: 9px;
            font: inherit;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #6757d9;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .login-error {
            background: #fde8e9;
            color: #bd3742;
        }

        .login-success {
            background: #e4f7ec;
            color: #21834c;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-brand">Digital<span>VX</span></div>

        <h1>Bem-vindo de volta</h1>
        <p class="login-subtitle">
            Entre com suas credenciais para acessar o sistema.
        </p>

        <div class="login-message login-error" th:if="${param.erro}">
            Login ou senha inválidos.
        </div>

        <div class="login-message login-success" th:if="${param.logout}">
            Você saiu do sistema com segurança.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Login</label>
                <input id="username" name="username" type="text"
                       autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>

            <button class="login-button" type="submit">
                Entrar no sistema
            </button>
        </form>
    </main>
</body>
</html>
